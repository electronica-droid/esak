<script>
    if (typeof supabase === 'undefined') {
        alert("⚠️ CDN ERROR: Unable to load Supabase SDK. Turn off ad blockers or test in an incognito window.");
    } else {
        const SUPABASE_URL = "https://secuyzzqpcnatksmyqfw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlY3V5enpxcGNuYXRrc215cWZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjkwMjUsImV4cCI6MjEwMTY0NTAyNX0.V871uFCf1cGe023tKq6IfuyH9TSlg3qpgEuJg0lF2gk";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let cloudCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            const todayIso = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('requestDate');
            if (dateInput) dateInput.value = todayIso;

            // Bind submit event directly to prevent inline event handling bugs
            const form = document.getElementById('fuelRequestForm');
            if (form) {
                form.addEventListener('submit', handleFormSubmit);
            }

            fetchData();
        });

        window.calculateTotalCost = function() {
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('fuelPrice').value) || 0;
            document.getElementById('estimatedCost').value = (qty * price).toFixed(2);
        };

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            const btnId = 'btn-' + tabId.split('-')[1];
            if (document.getElementById(btnId)) {
                document.getElementById(btnId).classList.add('active');
            }
            if (tabId === 'tab-approval') fetchData();
        };

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitFormBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving to Supabase...";

            const todayIso = new Date().toISOString().split('T')[0];
            const dateVal = document.getElementById('requestDate').value || todayIso;
            const fuelSelected = document.querySelector('input[name="fuelType"]:checked').value;
            const reqIdVal = `#2026-${Math.floor(100 + Math.random() * 900)}`;

            const payload = {
                req_id: reqIdVal,
                personnel: document.getElementById('officerName').value.trim(),
                rank: document.getElementById('officerRank').value.trim(),
                branch: document.getElementById('unitStation').value.trim(),
                vessel_vehicle: document.getElementById('vesselVehicle').value.trim(),
                fuel_type: fuelSelected,
                quantity: parseFloat(document.getElementById('quantity').value),
                cost: parseFloat(document.getElementById('estimatedCost').value),
                status: 'pending',
                date: dateVal,
                purpose: document.getElementById('purpose').value.trim()
            };

            console.log("Sending payload to Supabase:", payload);

            try {
                // Direct call to Supabase
                const { data, error } = await supabaseClient
                    .from('fuel_requests')
                    .insert([payload])
                    .select();

                if (error) {
                    alert("❌ SUPABASE SAVE ERROR:\n" + error.message);
                    console.error("Supabase Save Error:", error);
                } else {
                    alert(`✅ SUCCESS: Requisition ${reqIdVal} saved to Supabase SQL!`);
                    document.getElementById('fuelRequestForm').reset();
                    document.getElementById('requestDate').value = todayIso;
                    await fetchData();
                    switchTab('tab-approval');
                }
            } catch (err) {
                alert("❌ UNEXPECTED EXCEPTION: " + err.message);
                console.error("Submit exception:", err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Fuel Request";
            }
        }

        async function fetchData() {
            try {
                const { data, error } = await supabaseClient
                    .from('fuel_requests')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Fetch error:", error);
                    return;
                }

                cloudCache = data || [];
                renderTable();
            } catch (err) {
                console.error("Fetch exception:", err);
            }
        }

        window.renderTable = function() {
            const filterVal = document.getElementById('statusFilter').value;
            const tbody = document.getElementById('approvalTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            const filtered = cloudCache.filter(r => filterVal === 'ALL' || r.status === filterVal);

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-row-msg">No entries found for this filter.</td></tr>`;
                return;
            }

            filtered.forEach(req => {
                const row = tbody.insertRow();
                const badgeClass = req.status === 'approved' ? 'approved' : (req.status === 'disapproved' ? 'disapproved' : 'pending');

                row.innerHTML = `
                    <td><strong>${req.req_id}</strong></td>
                    <td>${req.vessel_vehicle}</td>
                    <td>${req.fuel_type}</td>
                    <td>${req.quantity} L</td>
                    <td>₱${parseFloat(req.cost).toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                    <td><span class="status-badge ${badgeClass}">${req.status}</span></td>
                    <td><span style="font-size:11px; color:#059669; font-weight:bold;">● SQL Synced</span></td>
                `;
            });
        };
    }
</script>
